    <!--
      Staging gate. nginx serves this page instead of the app until the browser holds the cookie
      ctrl_staging = sha256("ctrl-academy-staging:" + password). See web/staging-gate.sh.
    -->
    <style>
      :root {
        --accent: #2470c9;
        --edge: #184a85;
        --ink: #141413;
        --paper: #fafaf7;
        --bg: var(--paper);
        --surface: #ffffff;
        --line: #dcdbd3;
        --fg: var(--ink);
        --muted: #5c5b55;
        --danger: #b42318;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: var(--ink);
          --surface: #1f1f1d;
          --line: #3a3a35;
          --fg: var(--paper);
          --muted: #a8a79f;
          --danger: #f97066;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 'Space Grotesk',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 22rem;
      }
      .lockup {
        display: block;
        height: 40px;
        width: auto;
        margin-bottom: 40px;
        color: var(--fg);
      }
      .lockup .word {
        fill: currentColor;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 28px;
        color: var(--muted);
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        font-size: 0.95rem;
      }
      input {
        width: 100%;
        height: 46px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        color: var(--fg);
        font:
          500 1rem 'JetBrains Mono',
          ui-monospace,
          monospace;
      }
      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
      }
      input[aria-invalid='true'] {
        border-color: var(--danger);
      }
      .error {
        min-height: 1.4em;
        margin: 8px 0 0;
        color: var(--danger);
        font-size: 0.875rem;
      }
      /* Built like the logo's keycap: darker edge underneath, face on top. */
      button {
        position: relative;
        width: 100%;
        height: 48px;
        margin-top: 12px;
        border: 0;
        border-radius: 10px;
        background: var(--edge);
        color: #fff;
        font:
          700 1rem 'Space Grotesk',
          system-ui,
          sans-serif;
        cursor: pointer;
        padding: 0 0 4px;
      }
      button span {
        position: absolute;
        inset: 0 0 4px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: var(--accent);
        transition: transform 0.06s;
      }
      button:active span {
        transform: translateY(3px);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      button:disabled {
        cursor: progress;
        opacity: 0.8;
      }
      .foot {
        margin: 32px 0 0;
        font:
          500 0.75rem 'JetBrains Mono',
          ui-monospace,
          monospace;
        color: var(--muted);
      }
    </style>

      <h1>Ctrl Academy staging</h1>
      <p>
        This is where the Ctrl Group tests work in progress. Enter the team password to continue.
      </p>
      <form id="gate" novalidate>
        <label for="password">Team password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          autofocus
          required
          aria-describedby="error"
        />
        <p id="error" class="error" role="alert"></p>
        <button type="submit"><span>Continue</span></button>
      </form>
      <p class="foot">Not on the team? The live site is ctrlacademy.co.za.</p>
    </main>
    <script>
      const form = document.getElementById('gate')
      const input = document.getElementById('password')
      const error = document.getElementById('error')
      const button = form.querySelector('button')

      async function token(password) {
        const bytes = new TextEncoder().encode('ctrl-academy-staging:' + password)
        const hash = await crypto.subtle.digest('SHA-256', bytes)
        return Array.from(new Uint8Array(hash), (b) => b.toString(16).padStart(2, '0')).join('')
      }

      function setCookie(value, maxAge) {
        const secure = location.protocol === 'https:' ? '; Secure' : ''
        document.cookie = `ctrl_staging=${value}; Path=/; Max-Age=${maxAge}; SameSite=Lax${secure}`
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        if (!input.value) {
          error.textContent = 'Enter the team password.'
          input.setAttribute('aria-invalid', 'true')
          return
        }
        button.disabled = true
        error.textContent = ''
        setCookie(await token(input.value), 60 * 60 * 24 * 30)
        const res = await fetch(location.pathname + location.search, {
          method: 'HEAD',
          cache: 'no-store',
        })
        if (res.status !== 401) {
          location.reload()
          return
        }
        setCookie('', 0)
        button.disabled = false
        input.setAttribute('aria-invalid', 'true')
        error.textContent = "That password didn't work. Ask the team for it."
        input.select()
      })
      input.addEventListener('input', () => {
        input.removeAttribute('aria-invalid')
        error.textContent = ''
      })
    </script>
