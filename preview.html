a structure"}, {"id": "t2", "text": "Algorithm"}, {"id": "t3", "text": "Graph"}, {"id": "t4", "text": "Graph traversal"}], "right": [{"id": "d1", "text": "A way to organise and store data so it can be used. Example: a queue."}, {"id": "d2", "text": "A finite list of steps that solves a problem. Example: the steps for finding the largest number in a list."}, {"id": "d3", "text": "A set of vertices joined by edges. Example: buildings joined by walkways."}, {"id": "d4", "text": "Visiting the vertices of a graph by following its edges. Example: walking to every building along walkways."}]}, "answer": {"pairs": {"t1": "d1", "t2": "d2", "t3": "d3", "t4": "d4"}}, "feedback": {"correct": {"result": "All four matched.", "reason": "Graphs are data structures, and a traversal is an algorithm that works on a graph.", "next_step": "Next, a worked example of reading a graph."}, "t1": {"result": "Check \"data structure\".", "reason": "A data structure stores and organises data. The queue from COS110 is one.", "next_step": "Find the description that talks about storing data."}, "t2": {"result": "Check \"algorithm\".", "reason": "An algorithm is a list of steps. It does something; it doesn't store anything.", "next_step": "Find the description that talks about steps."}, "t3": {"result": "Check \"graph\".", "reason": "A graph is made of vertices and edges.", "next_step": "Find the description that mentions vertices and edges."}, "t4": {"result": "Check \"graph traversal\".", "reason": "A traversal visits vertices by following edges.", "next_step": "Find the description about visiting every vertex."}}, "hints": ["Two of these store or organise things; two of them do something.", "A queue stores data. Finding the largest number is a set of steps.", "A graph is a kind of data structure. A traversal is a kind of algorithm.", "Answer: data structure \u2192 organise and store (queue); algorithm \u2192 list of steps (largest number); graph \u2192 vertices and edges (buildings and walkways); e shuttle **directly** from the Dining hall (D) to the Admin block (A)?", "config": {"scenario_id": "m1-shuttle", "show_graph": true, "options": [{"id": "a", "text": "No. The edge between them points from A to D."}, {"id": "b", "text": "Yes. A and D are joined by an edge, so you can go either way."}, {"id": "c", "text": "Yes. The shuttle visits both stops."}]}, "answer": {"correct": "a"}, "feedback": {"correct": {"result": "Correct.", "reason": "In a directed graph you can only follow an edge the way its arrow points. The edge goes A \u2192 D.", "next_step": "To get from D to A you'd ride D \u2192 G \u2192 A."}, "b": {"result": "Not in a directed graph.", "reason": "This graph has arrows. The edge between A and D only points from A to D.", "next_step": "Check which way the arrow on that edge points."}, "c": {"result": "Not directly.", "reason": "Visiting both stops doesn't mean there's an edge from D to A. The only edge out of D goes to G.", "next_step": "Follow the arrows leaving D."}}, "hints": ["This graph has arrows on its edges.", "You can only travel along an edge in the direction of its arrow.", "Find the edge between A and D. Which end is the arrow pointing to?", "Answer: no. The edge is A \u2192 D, so from D you must go D \u2192 G \u2192 A."]}, {"id": "m1-classify", "objective_id": 2, "purpose": "practice", "kind": "classify_graphs", "prompt": "Classify each graph as **directed** or **undirected**.", "config": {"scenario_ids": ["m1-cls-friends", "m1-cls-follows", "m1-cls-route", "m1-cls-roads"], "categories": ["directed", "undirected"]}, "answer": {"classes": {"m1-cls-friends": "undirected", "m1-cls-follows": "directed", "m1-cls-route": "directed", "m1-cls-roads": "undirected"}}, "feedback": {"correct": {"result": "All four classified correctly.", "reason": "Graphs with arrows are directed; graphs with plain lines are undirected.", "next_step": "Next, turn real situations into graphs."}, "m1-cls-friends": {"result": "Check the friendships graph.", "reason": "Friendship goes both ways: if Thandi is Sipho's friend, Sipho is Thandi's friend. The edges have no arrows.", "next_step": "Look for arrows. No arrows means undirected."}, "m1-cls-follows": {"result": "Check the follows graph.", "reason": "Ana and Ben follow each other, but that's two separate arrows. Ben follows Cara without Cara following back. Any arrow makes a graph directed.", "next_step": "Look closely: the edges have arrowheads."}, "m1-cls-route": {"result": "Check the delivery route.", "reason": "The van drives Warehouse \u2192 Shop X \u2192 Shop Y \u2192 Warehouse, one way only. The edges are arrows.", "next_step": "Ask: can you travel each edge in both directions?"}, "m1-cls-roads": {"result": "Check the roads graph.", "reason": "Roads between towns can be driven both ways, so the edges are plain lines.", "next_step": "No arrows means undirected."}}, "hints": ["Look at the edges: do they have arrowheads or not?", "Edges with arrows mean the connection only goes one way. That's a directed graph.", "Watch out for the follows graph: two arrows between the same pair still make it directed.", "Answer: friendships = undirected, follows = directed, delivery route = directed, roads = undirected."]}, {"id": "m1-model", "objective_id": 3, "purpose": "practice", "kind": "matching", "prompt": "Match each real situation to the graph that models it: what the vertices are, what the edges are, and whether it's directed.", "config": {"left": [{"id": "s1", "text": "Gautrain stations and the tracks between them. Trains run both ways."}, {"id": "s2", "text": "Instagram accounts and who follows whom."}, {"id": "s3", "text": "Web pages and the links from one page to another."}, {"id": "s4", "text": "Classmates and who has shaken hands with whom."}], "right": [{"id": "r1", "text": "Vertices: stations. Edges: tracks. Undirected."}, {"id": "r2", "text": "Vertices: accounts. Edges: follows. Directed."}, {"id": "r3", "text": "Vertices: pages. Edges: links. Directed."}, {"id": "r4", "text": "Vertices: classmates. Edges: handshakes. Undirected."}, {"id": "r5", "text": "Vertices: tracks. Edges: stations. Undirected."}]}, "answer": {"pairs": {"s1": "r1", "s2": "r2", "s3": "r3", "s4": "r4"}}, "feedback": {"correct": {"result": "All four modelled correctly.", "reason": "The things become vertices, the connections become edges, and one-way connections make the graph directed.", "next_step": "In Module 2 you'll store a graph like these in Python."}, "s1": {"result": "Check the Gautrain.", "reason": "The stations are the things (vertices) and the tracks connect them (edges). Trains run both ways, so it's undirected.", "next_step": "Watch out for the option that swaps tracks and stations."}, "s2": {"result": "Check Instagram.", "reason": "Following someone doesn't mean they follow you back, so the edges are one-way.", "next_step": "Look for the option with accounts and directed edges."}, "s3": {"result": "Check the web pages.", "reason": "A link from page X to page Y doesn't create a link back, so it's directed.", "next_step": "Look for the option with pages and links."}, "s4": {"result": "Check the handshakes.", "reason": "A handshake involves both people equally, so it's undirected.", "next_step": "Look for the option with classmates and handshakes."}}, "hints": ["For each situation, ask: what are the things, and what connects them?", "The things are vertices. The connections are edges.", "Then ask: does the connection work both ways? If not, the graph is directed. Following and linking are one-way.", "Answer: Gautrain \u2192 stations/tracks/undirected; Instagram \u2192 accounts/follows/directed; web \u2192 pages/links/directed; handshakes \u2192 classmates/handshakes/undirected."]}]}</script>

<script>
const MOD = JSON.parse(document.getElementById("module-data").textContent);
const SCN = Object.fromEntries(JSON.parse(document.getElementById("scenario-data").textContent).scenarios.map(s => [s.id, s]));
const ACT = Object.fromEntries(MOD.activities.map(a => [a.id, a]));
const POS = {
  campus: { A: [60, 55], C: [190, 55], B: [320, 55], G: [450, 55], E: [60, 165], F: [190, 165], D: [60, 270] },
  "m3-trace-practice": { A: [90, 60], B: [260, 60], C: [90, 175], D: [260, 175], E: [90, 285] },
  "m1-campus": { A: [60, 55], C: [190, 55], B: [320, 55], G: [450, 55], E: [60, 165], F: [190, 165], D: [60, 270] },
  "m1-shuttle": { A: [70, 60], D: [290, 60], G: [180, 210] },
  "m1-bus-stops": { P: [60, 60], Q: [210, 60], R: [210, 200], S: [360, 200] },
  "m1-skip": { P: [60, 60], Q: [200, 60], R: [340, 60], S: [200, 180] },
  "m1-cls-friends": { T: [60, 50], S: [240, 50], L: [150, 170] },
  "m1-cls-follows": { A: [60, 50], B: [240, 50], C: [150, 170] },
  "m1-cls-route": { W: [60, 50], X: [240, 50], Y: [150, 170] },
  "m1-cls-roads": { J: [150, 50], P: [60, 170], S: [240, 170] }
};
const done = new Set();
let segIndex = 0, timer = null;

// ---------- helpers ----------
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "html") n.innerHTML = v; else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
};
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\*([^*]+)\*/g, "<em>$1</em>");
function md(text) {
  const out = []; const lines = text.split("\n"); let i = 0;
  while (i < lines.length) {
    if (lines[i].trim().startsWith("|")) {
      const rows = []; while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(rows[0]), body = rows.slice(2).map(cells);
      out.push(`<div class="tablewrap"><table><thead><tr>${head.map(h => `<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
    } else if (lines[i].trim()) { out.push(`<p>${inline(lines[i])}</p>`); i++; } else i++;
  }

function video(seg, n, onDone) {
  const v = seg.video, cues = CUES[n], cps = v.checkpoints.map(c => ({ ...c, ok: false }));

  const screen = el("div", { class: "screen" }), caption = el("div", { class: "caption" }), cpArea = el("div");
  const fill = el("div", { class: "fill" }), bar = el("div", { class: "bar", title: "You can seek back, but not past an unanswered checkpoint" }, fill,
    cps.map(c => { c.mark = el("div", { class: "cp", style: `left:${(c.at_seconds / v.duration_seconds) * 100}%` }); return c.mark; }));
  const time = el("span", { class: "time" }); const play = el("button", { class: "btn", type: "button" }, "Play");
  const trans = el("details", { class: "transcript" }, el("summary", {}, "Transcript"), cues.map(c => el("p", {}, c[1])));
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

  const tick = () => {
    const cp = cps.find(c => !c.ok && t >= c.at_seconds);

  };
  const openCp = cp => {
    t = cp.at_seconds; show();

        cpArea.querySelector(".cpbox").append(el("div", { class: "row", style: "margin-top:10px" }, el("button", { class: "btn", type: "button", onclick: () => { cpArea.replaceChildren(); t = cp.at_seconds + 1; start(); } }, "Resume video"))); })));
  };

}

function renderRail() {

      el("span", { class: "mark" }, done.has(i) ? "✓" : String(i + 1)), el("span", {}, el("span", { class: "kind" }, s.kind.replace("_", " ")), s.title)))));
