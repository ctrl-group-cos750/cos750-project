# Included in nginx.conf wherever a location sets its own headers (nginx drops inherited
# add_header lines in that case). Not on the staging gate page, which needs Google Fonts and an
# inline script, nor on /api/, where the docs page loads its scripts from a CDN.
add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# Only our own scripts, styles, fonts and images; no framing (clickjacking); forms post only here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
