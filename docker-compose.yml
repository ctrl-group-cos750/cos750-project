# Coolify deploys this file as-is (Docker Compose build pack). Only `web` gets a domain;
# it serves the SPA and forwards /api to `api`. Nothing publishes a port: Coolify's proxy
# reaches `web` on the internal network. For local use add docker-compose.local.yml.
services:
  web:
    build: ./web
    expose:
      - "80"
    environment:
      # Set in Coolify for staging only: the whole site then sits behind a team-password page.
      STAGING_PASSWORD: ${STAGING_PASSWORD:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./api
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ctrl}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-ctrl}
      # Signs session cookies. Unset, the API makes a random one and everyone is logged out on restart.
      SECRET_KEY: ${SECRET_KEY:-}
      # "off" in production: hides /api/docs and /api/openapi.json. Staging keeps them for the team.
      API_DOCS: ${API_DOCS:-on}
      RUNNER_URL: http://runner:8000
    networks:
      - default
      - sandbox
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_healthy
    restart: unless-stopped

  # Runs students' Python (SE document NFR-S7). Only on the internal `sandbox` network, which
  # has no route to the internet and holds only the API; no secrets, no volumes, no database.
  runner:
    build: ./runner
    expose:
      - "8000"
    networks:
      - sandbox
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctrl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-ctrl}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  sandbox:
    internal: true

volumes:
  db-data:
