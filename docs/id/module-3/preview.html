:root {

  --background: #f5fcfe; --foreground: var(--navy-800);
  --card: #ffffff; --card-foreground: var(--navy-800);

}

/* aliases used by the page script */
:root { --surface: var(--card); --line: var(--border); --ink: var(--foreground); --bg: var(--muted);
  --accent: var(--st-visited); --accent-soft: var(--st-visited-soft);

* { box-sizing: border-box; border-color: var(--border); }
body { background: var(--background); color: var(--foreground); font: 15px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1140px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }

.note { font-size: .85rem; color: var(--muted-foreground); max-width: 62ch; margin: 0; }

nav.rail button { width: 100%; text-align: left; display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 10px; align-items: center;
  background: none; border: 0; border-radius: calc(var(--radius) - 2px); padding: 7px 8px; font: 500 .875rem var(--font); color: var(--foreground); cursor: pointer; }

nav.rail button[aria-current="true"] { background: var(--secondary); color: var(--secondary-foreground); }
nav.rail .mark { font: 600 .72rem/24px var(--mono); text-align: center; border-radius: 50%; width: 24px; height: 24px; border: 1px solid var(--border); color: var(--muted-foreground); background: var(--card); }
nav.rail .done .mark { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
nav.rail .kind { display: block; font: 400 .7rem var(--font); color: var(--muted-foreground); }

main.stage { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; min-width: 0; box-shadow: 0 1px 2px rgb(2 62 138 / .05); }
main.stage h2 { margin: 2px 0 14px; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.prompt { margin: 0 0 16px; max-width: 70ch; }
code, .mono { font-family: var(--mono); font-size: .88em; }
code { background: var(--muted); padding: .1em .35em; border-radius: 4px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tag { font: 500 .72rem var(--font); padding: 2px 8px; border-radius: calc(var(--radius) - 4px); border: 1px solid var(--border); background: var(--secondary); color: var(--secondary-foreground); }

.options { display: grid; gap: 8px; margin-bottom: 14px; max-width: 560px; }
.opt { display: flex; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); padding: 10px 12px; cursor: pointer; font-size: .92rem; }
.opt:hover { background: var(--muted); }
.opt:has(input:checked) { border-color: var(--primary); background: var(--secondary); }
.opt input { accent-color: var(--primary); width: 16px; height: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button.btn { display: inline-flex; align-items: center; justify-content: center; height: 36px; padding: 0 16px; font: 500 .875rem var(--font);
  border-radius: calc(var(--radius) - 2px); cursor: pointer; border: 1px solid transparent; background: var(--primary); color: var(--primary-foreground); box-shadow: 0 1px 2px rgb(2 62 138 / .08); }

.feedback { margin-top: 14px; padding: 12px 14px; border-radius: var(--radius); max-width: 70ch; border: 1px solid; font-size: .92rem; }
.feedback.ok { background: var(--success-soft); color: var(--success); border-color: color-mix(in srgb, var(--success) 35%, transparent); }
.feedback.no { background: var(--destructive-soft); color: var(--destructive); border-color: color-mix(in srgb, var(--destructive) 35%, transparent); }

.feedback span { color: var(--foreground); }

.hints { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
.hints ol { margin: 10px 0 0; padding-left: 22px; display: grid; gap: 6px; max-width: 70ch; font-size: .92rem; }

.match .bad select { border-color: var(--destructive); }
.match .good select { border-color: var(--success); }

.viz { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; margin-bottom: 14px; }

svg.graph text { font: 600 15px var(--mono); fill: var(--foreground); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--muted-foreground); margin-top: 8px; }

.chip.q { background: var(--st-queued-soft); border-color: var(--st-queued); border-style: dashed; color: var(--foreground); }
.chip.c { background: var(--st-current-soft); border-color: var(--st-current); border-width: 2px; color: var(--foreground); }
.chip.front::before { content: "front ▸ "; font-weight: 400; color: var(--muted-foreground); }

.player { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
.screen { background: var(--muted); padding: 14px; min-height: 120px; }
.caption { font-size: 1rem; background: var(--secondary); color: var(--secondary-foreground); border-top: 1px solid var(--border); padding: 10px 14px; min-height: 3.6em; }
.controls { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); flex-wrap: wrap; background: var(--card); }
.bar { position: relative; flex: 1 1 200px; height: 8px; background: var(--secondary); border-radius: 99px; cursor: pointer; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--primary); border-radius: 99px; }
.bar .cp { position: absolute; top: -4px; width: 4px; height: 16px; background: var(--cp-mark); border-radius: 2px; }
.bar .cp.answered { background: var(--success); }
.time { font: .8rem var(--mono); font-variant-numeric: tabular-nums; color: var(--muted-foreground); }
.cpbox { border: 2px solid var(--primary); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.transcript { font-size: .9rem; max-width: 72ch; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; }
.transcript summary { cursor: pointer; font-weight: 500; }
.transcript p { margin: 6px 0; color: var(--muted-foreground); }
.transcript p.now { color: var(--foreground); font-weight: 600; }

.tablewrap { overflow-x: auto; margin-bottom: 14px; border: 1px solid var(--border); border-radius: var(--radius); }
table { border-collapse: collapse; font-size: .875rem; min-width: 520px; width: 100%; }
th, td { border-bottom: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font: 500 .8rem var(--font); color: var(--muted-foreground); background: var(--muted); }
td input { width: 100%; min-width: 80px; height: 32px; font: .85rem var(--mono); padding: 0 8px; border-radius: 6px; border: 1px solid var(--input); background: var(--card); color: var(--foreground); }
td.good input { border-color: var(--success); background: var(--success-soft); }

.md .tablewrap { margin: 12px 0; }
.md p { max-width: 70ch; }
.skip { border: 1px dashed var(--blue-400); background: var(--muted); border-radius: var(--radius); padding: 16px; margin-bottom: 18px; }
.nextbar { display: flex; justify-content: space-between; gap: 8px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
.swatches { display: flex; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
.swatches span { width: 14px; height: 22px; }
