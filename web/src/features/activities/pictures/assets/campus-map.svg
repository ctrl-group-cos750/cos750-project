<title id="t">Campus guide map</title>
<desc id="d">A campus map. Seven walkways: Admin block to Computer Science, Admin block to Engineering, Bookshop to Computer Science, Bookshop to the Green, Computer Science to the Fountain, Dining hall to Engineering, Engineering to the Fountain.</desc>
