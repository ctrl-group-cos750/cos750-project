<script id="module-data" type="application/json">{"module": {"number": 4, "slug": "write-bfs", "title": "Write BFS", "estimated_minutes": 15, "objectives": [6], "goals": ["write bfs(graph, start) in Python on your own Graph class, using a queue and a visited set, so it returns the vertices in the order BFS visits them"]}, "segments": [{"position": 1, "kind": "activity", "title": "Quick recall: the BFS order", "activity_id": "m4-recall-trace"}, {"position": 2, "kind": "activity", "title": "Quick recall: adjacency lists", "activity_id": "m4-recall-adjacency"}, {"position": 3, "kind": "video", "title": "From a trace to code", "video": {"media_path": "module-4/01-trace-to-code.mp4", "captions_path": "module-4/01-trace-to-code.vtt", "transcript": "docs/id/module-4/narration-script.md", "duration_seconds": 150, "checkpoints": [{"at_seconds": 80, "activity_id": "m4-ck-popleft"}, {"at_seconds": 125, "activity_id": "m4-ck-visited"}]}}, {"position": 4, "kind": "worked_example", "title": "Worked example: BFS line by line", "skip_check_activity_id": "m4-skip-check", "body": "Here is the whole function. Each line matches something you did by hand in module 3.\n\n```python\nfrom collections import deque\n\n\ndef bfs(graph, start):\n    visited = {start}\n    queue = deque([start])\n    order = []\n    while queue:\n        v = queue.popleft()\n        order.append(v)\n        for n in sorted(graph.adjacency[v]):\n            if n not in visited:\n                visited.add(n)\n                queue.append(n)\n    return order\n```\n\n| Line | What it does in the trace |\n|---|---|\n| `visited = {start}` | The start is found straight away. |\n| `queue = deque([start])` | The start waits in the queue. |\n| `while queue:` | Keep going until no vertex is waiting. |\n| `v = queue.popleft()` | Take the vertex at the front. |\n| `order.append(v)` | Write it in the order. |\n| `for n in sorted(...)` | Look at its neighbours in alphabetical order. |\n| `visited.add(n)` + `queue.append(n)` | A new neighbour is marked and joins the back. |\n\n**Running it** on the graph with edges P\u2013Q, P\u2013R and Q\u2013S, starting at P:\n\n| `v` | Order so far | Queue after | Visited |\n|---|---|---|---|\n| `P` | P | Q, R | P, Q, R |\n| `Q` | P, Q | R, S | P, Q, R, S |\n| `R` | P, Q, R | S | P, Q, R, S |\n| `S` | P, Q, R, S | (empty) | P, Q, R, S |\n\n**Result:** `[\"P\", \"Q\", \"R\", \"S\"]`."}, {"position": 5, "kind": "activity", "title": "Parsons: put BFS in order", "activity_id": "m4-parsons"}, {"position": 6, "kind": "activity", "title": "Code: fill in the missing lines", "activity_id": "m4-fill"}, {"position": 7, "kind": "activity", "title": "Code: write BFS yourself", "activity_id": "m4-write"}, {"position": 8, "kind": "activity", "title": "Closing task: BFS on the shuttle", "activity_id": "m4-closing"}], "activities": [{"id": "m4-recall-trace", "objective_id": 5, "purpose": "retrieval", "kind": "multiple_choice", "prompt": "Quick recall from module 3. You traced BFS on the campus graph starting at A. In what order did BFS visit the buildings?", "config": {"scenario_id": "m4-campus", "show_graph": true, "options": [{"id": "a", "text": "A, C, E, B, F, D, G"}, {"id": "b", "text": "A, B, C, D, E, F, G"}, {"id": "c", "text": "A, C, B, G, F, E, D"}]}, "answer": {"correct": "a"}, "feedback": {"correct": {"result": "Correct.", "reason": "BFS visits A, then everything one edge away (C, E), then two away (B, F, D), then G.", "next_step": "In this module you'll write code that produces this order."}, "b": {"result": "Not quite. That's just alphabetical order.", "reason": "Alphabetical order only decides which neighbour joins the queue first. BFS still goes ring by ring.", "next_step": "Think about which buildings are one walkway from A."}, "c": {"result": "Not quite. That goes deep first.", "reason": "This order follows one path as far as it goes (A, C, B, G) before coming back. BFS finishes each ring first.", "next_step": "Visit all of A's neighbours before any of their neighbours."}}, "hints": ["BFS explores in rings: one edge away, then two, then three.", "A's neighbours are C and E, so they come straight after A.", "Two edges away: B and F (through C) and D (through E).", "Answer: A, C, E, B, F, D, G."]}, {"id": "m4-recall-adjacency", "objective_id": 2, "purpose": "retrieval", "kind": "multiple_choice", "prompt": "Quick recall from module 2. You build the campus graph with your `Graph` class. What is `g.adjacency[\"C\"]`?", "config": {"scenario_id": "m4-campus", "show_graph": true, "options": [{"id": "a", "text": "`[\"A\", \"B\", \"F\"]`"}, {"id": "b", "text": "`[\"F\"]`"}, {"id": "c", "text": "`[\"A\", \"B\", \"E\", \"F\"]`"}]}, "answer": {"correct": "a"}, "feedback": {"correct": {"result": "Correct.", "reason": "C is joined to A, B and F, and each undirected edge is stored both ways.", "next_step": "BFS will read this list to find C's neighbours."}, "b": {"result": "Not quite. That stores edges one way only.", "reason": "A\u2013C and B\u2013C are undirected, so A and B must also be in C's list.", "next_step": "Remember: an undirected edge goes in both lists."}, "c": {"result": "Not quite. E isn't joined to C.", "reason": "C and E are both near F, but there's no walkway C\u2013E.", "next_step": "Only list vertices with their own edge to C."}}, "hints": ["`g.adjacency[\"C\"]` is the list of C's neighbours.", "Find every edge that touches C.", "The edges are A\u2013C, B\u2013C and C\u2013F.", "Answer: [\"A\", \"B\", \"F\"]."]}, {"id": "m4-ck-popleft", "objective_id": 6, "purpose": "practice", "kind": "multiple_choice", "prompt": "`queue` is a `deque`. Which line takes the vertex at the **front** of the queue and removes it?", "config": {"options": [{"id": "a", "text": "`v = queue.popleft()`"}, {"id": "b", "text": "`v = queue.pop()`"}, {"id": "c", "text": "`v = queue[0]`"}]}, "answer": {"correct": "a"}, "feedback": {"correct": {"result": "Correct.", "reason": "`popleft()` removes and returns the item at the front: first
