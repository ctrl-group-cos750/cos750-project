name: ci

# On PRs only: a PR tests exactly what its merge puts on staging or master, so running again on
# the push that merge makes would only repeat it. (push-guard checks every push.)
on:
  pull_request:
    branches: [staging, master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, not one per part: GitHub bills each job rounded up to a whole minute, so four short
  # jobs cost twice what one does. Each part's steps run only when the PR touches that part; a
  # change to this file runs them all.
  checks:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci
    steps:
      - uses: actions/checkout@v5

      - name: Which parts the PR touches
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          echo "$files"
          touched() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          all=$(touched '^\.github/workflows/ci\.yml$')
          # The API's tests also scan web/src, runner and scripts for hidden characters.
          for area in web api runner compose; do
            case $area in
              web) pattern='^web/' ;;
              api) pattern='^(api|runner|scripts|web/src)/' ;;
              runner) pattern='^runner/' ;;
              compose) pattern='^(api|web|runner)/|^docker-compose[^/]*\.yml$|^\.env\.example$' ;;
            esac
            value=$(touched "$pattern")
            [ "$all" = true ] && value=true
            echo "$area=$value" >> "$GITHUB_OUTPUT"
            echo "$area: $value"
          done

      # web
      - if: steps.paths.outputs.web == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web
        if: steps.paths.outputs.web == 'true'
        working-directory: web
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run coverage
          npm run build

      # api and runner
      - if: steps.paths.outputs.api == 'true' || steps.paths.outputs.runner == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements-dev.txt
            runner/requirements-dev.txt
      - name: Postgres for the API's tests
        if: steps.paths.outputs.api == 'true'
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=ctrl -e POSTGRES_PASSWORD=ctrl \
            -e POSTGRES_DB=ctrl postgres:18-alpine
          until docker exec pg pg_isready -U ctrl -d ctrl; do sleep 1; done
      - name: api
        if: steps.paths.outputs.api == 'true'
        working-directory: api
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/ruff format --check .
          .venv/bin/ruff check --output-format=github .
          .venv/bin/mypy
          .venv/bin/pytest
      # Again on Postgres, as deployed: SQLite accepts things Postgres refuses (NUL in text).
      - name: api on Postgres
        if: steps.paths.outputs.api == 'true'
        working-directory: api
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ctrl:ctrl@localhost:5432/ctrl
        run: .venv/bin/pytest
      - name: runner
        if: steps.paths.outputs.runner == 'true'
        working-directory: runner
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/ruff format --check .
          .venv/bin/ruff check --output-format=github .
          .venv/bin/mypy
          .venv/bin/pytest --cov  # fails under 90% coverage

      # The images Coolify will build, so a broken Dockerfile fails here, not on deploy; then the
      # whole stack with the sandbox's security checks (NFR-S7).
      - name: Build and start the whole stack
        if: steps.paths.outputs.compose == 'true'
        run: |
          docker compose config --quiet
          docker compose build
          docker compose -p ctrlci up -d --wait
      # The runner has no network: the checks reach it, like the API, through its socket volume.
      - name: The runner container has no network at all
        if: steps.paths.outputs.compose == 'true'
        run: docker compose -p ctrlci exec -T runner python - < runner/tests/network_check.py
      - name: Hostile code against the runner container
        if: steps.paths.outputs.compose == 'true'
        run: >-
          docker run --rm -v ctrlci_runner-socket:/run/runner
          -v "$PWD/runner/tests/container_check.py:/check.py:ro"
          python:3.12-slim python /check.py unix:/run/runner/runner.sock
      # Whatever the sandbox does, only running code is affected: the app is measured at rest,
      # then while the sandbox is flooded with hostile code, then with the runner stopped.
      - name: The app keeps working while the sandbox is flooded
        if: steps.paths.outputs.compose == 'true'
        run: |
          docker run --rm --network ctrlci_default -v ctrlci_runner-socket:/run/runner \
            -v "$PWD/runner/tests/isolation_check.py:/check.py:ro" \
            python:3.12-slim python /check.py flood http://web unix:/run/runner/runner.sock
      - name: The app works with the runner stopped
        if: steps.paths.outputs.compose == 'true'
        run: |
          docker compose -p ctrlci stop runner
          docker run --rm --network ctrlci_default \
            -v "$PWD/runner/tests/isolation_check.py:/check.py:ro" \
            python:3.12-slim python /check.py runner-down http://web
      - name: Logs
        if: always() && steps.paths.outputs.compose == 'true'
        run: docker compose -p ctrlci logs --tail 50
      - if: always() && steps.paths.outputs.compose == 'true'
        run: docker compose -p ctrlci down -v
