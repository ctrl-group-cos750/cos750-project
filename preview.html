tivity_id": "m6-a-3-1"}, {"position": 12, "kind": "activity", "title": "Objective 3 \u00b7 item 2 of 4", "activity_id": "m6-a-3-2"}, {"position": 13, "kind": "activity", "title": "Objective 3 \u00b7 item 3 of 4", "activity_id": "m6-a-3-3"}, {"position": 14, "kind": "activity", "title": "Objective 3 \u00b7 item 4 of 4", "activity_id": "m6-a-3-4"}, {"position": 15, "kind": "activity", "title": "Objective 4 \u00b7 item 1 of 4", "activity_id": "m6-a-4-1"}, {"position": 16, "kind": "activity", "title": "Objective 4 \u00b7 item 2 of 4", "activity_id": "m6-a-4-2"}, {"position": 17, "kind": "activity", "title": "Objective 4 \u00b7 item 3 of 4", "activity_id": "m6-a-4-3"}, {"position": 18, "kind": "activity", "title": "Objective 4 \u00b7 item 4 of 4", "activity_id": "m6-a-4-4"}, {"position": 19, "kind": "activity", "title": "Objective 5 \u00b7 item 1 of 1", "activity_id": "m6-a-5-1"}, {"position": 20, "kind": "activity", "title": "Objective 6 \u00b7 item 1 of 1", "activity_id": "m6-a-6-1"}, {"position": 21, "kind": "activity", "title": "Objective 7 \u00b7 item 1 of 3", "activity_id": "m6-a-7-1"}, {"position": 22, "kind": "activity", "title": "Objective 7 \u00b7 item 2 of 3", "activity_id": "m6-a-7-2"}, {"position": 23, "kind": "activity", "title": "Objective 7 \u00b7 item 3 of 3", "activity_id": "m6-a-7-3"}], "review_segments": [{"id": "m6-review-1-text", "review_for_objective": 1, "position": 1, "kind": "text", "title": "Review: Data structures, algorithms, graphs and traversals", "body": "A **data structure** stores data (a queue, a dictionary, a graph). An **algorithm** is a list of steps (BFS, sorting). A **graph** is vertices joined by edges. A **graph traversal** visits the vertices by following edges, and BFS is one.\n\n**Go back to:** Module 1, segments 2 and 3 (video \u201cFrom a map to a graph\u201d and \u201cKey terms\u201d).", "revisit_activity_ids": ["m1-terms", "m1-ck-traversal"]}, {"id": "m6-review-1-practice", "review_for_objective": 1, "position": 2, "kind": "activity", "title": "Review practice: data structures, algorithms, graphs and traversals", "activity_id": "m6-review-1"}, {"id": "m6-review-2-text", "review_for_objective": 2, "position": 1, "kind": "text", "title": "Review: Vertices, edges and direction", "body": "**Vertices** are the circles (the things). **Edges** are the lines (the connections), named by their two ends. If edges have **arrows**, the graph is **directed**; plain lines mean **undirected**. Two arrows between the same pair still make it directed.\n\n**Go back to:** Module 1, segments 4, 5, 7 and 8 (worked example, labelling, \u201cOne-way or two-way?\u201d, classifying).", "revisit_activity_ids": ["m1-label", "m1-classify"]}, {"id": "m6-review-2-practice", "review_for_objective": 2, "position": 2, "kind": "activity", "title": "Review practice: vertices, edges and direction", "activity_id": "m6-review-2"}, {"id": "m6-review-3-text", "review_for_objective": 3, "position": 1, "kind": "text", "title": "Review: Modelling a real situation as a graph", "body": "Ask three questions. What are the **things**? They're the vertices. What **connects** them? Those are the edges. Does each connection work **both ways**? If not, the graph is directed.\n\n**Go back to:** Module 1, segments 6 and 9 (building the campus graph and \u201cGraphs in real life\u201d).", "revisit_activity_ids": ["m1-model", "m1-build"]}, {"id": "m6-review-3-practice", "review_for_objective": 3, "position": 2, "kind": "activity", "title": "Review practice: modelling a real situation as a graph", "activity_id": "m6-review-3"}, {"id": "m6-review-4-text", "review_for_objective": 4, "position": 1, "kind": "text", "title": "Review: When BFS is the right tool", "body": "BFS is good for two jobs: finding the route with the **fewest edges**, and finding **everything reachable** from a start. It isn't for problems without connections, or where edges have different costs or lengths.\n\n**Go back to:** Module 3, segments 3 and 4 (video \u201cWhy BFS?\u201d and \u201cWhen is BFS the right tool?\u201d).", "revisit_activity_ids": ["m3-when-bfs"]}, {"id": "m6-review-4-practice", "review_for_objective": 4, "position": 2, "kind": "activity", "title": "Review practice: when bfs is the right tool", "activity_id": "m6-review-4"}, {"id": "m6-review-5-text", "review_for_objective": 5, "position": 1, "kind": "text", "title": "Review: Tracing BFS by hand", "body": "Each step: take the vertex at the **front** of the queue; add its unvisited neighbours to the **back**, in alphabetical order; mark them **visited** as they join. Repeat until the queue is empty.\n\n**Go back to:** Module 3, segments 5 to 8 (video \u201cBFS step by step\u201d, prediction, worked trace table, trace practice).", "revisit_activity_ids": ["m3-predict-campus", "m3-trace-practice"]}, {"id": "m6-review-5-practice", "review_for_objective": 5, "position": 2, "kind": "activity", "title": "Review practice: tracing bfs by hand", "activity_id": "m6-review-5"}, {"id": "m6-review-6-text", "review_for_objective": 6, "position": 1, "kind": "text", "title": "Review: Writing BFS in Python", "body": "Before the loop: `visited = {start}`, `queue = deque([start])`, `order = []`. In the loop: `v = queue.popleft()`, `order.append(v)`, then for each `n` in `sorted(graph.adjacency[v])`, if it isn't visited, add it to `visited` and `queue`. Return `order`.\n\n**Go back to:** Module 4, segments 4 to 7 (worked example, Parsons, fill-in, writing BFS).", "revisit_activity_ids": ["m4-parsons", "m4-fill", "m4-write"]}, {"id": "m6-review-6-practice", "review_for_objective": 6, "position": 2, "kind": "activity", "title": "Review practice: writing bfs in python", "activity_id": "m6-review-6"}, {"id": "m6-review-7-text", "review_for_objective": 7, "position": 1, "kind": "text", "title": "Review: Testing and debugging BFS", "body": "A good test builds a small graph, calls `bfs`, and asserts the **exact** list it should return. Two graphs catch most BFS bugs: one with a **cycle** (catches vertices visited twice) and one that's **disconnected** (catches vertices that shouldn't be reached).\n\n**Go back to:** Module 5 (Test and debug).", "revisit_activity_ids": []}, {"id": "m6-review-7-practice", "review_for_objective": 7, "position": 2, "kind": "activity", "title": "Review practice: testing and debugging bfs", "activity_id": "m6-review-7"}], "activities": [{"id": "m6-a-1-1", "objective_id": 1, "purpose": "mastery", "kind": "multiple_choice", "prompt": "Which of these is a **data structure**?", "config": {"options": [{"id": "a", "text": "A Python dictionary that maps each vertex to its neighbours"}, {"id": "b", "text": "The steps BFS follows to visit every vertex"}, {"id": "c", "text": "Visiting every page of a website by following links"}]}, "answer": {"correct": "a"}, "feedback": {"correct": {"result": "Correct.", "reason": "A dictionary of neighbour lists stores the graph's data. The other two are things you do, not things that store data.", "next_step": "Carry on with the next item."}, "b": {"result": "Not quite. That's an algorithm.", "reason": "A list of steps that does something is an algorithm. A data structure stores data.", "next_step": "Find the option that stores information."}, "c": {"result": "Not quite. That's a traversal.", "reason": "Visiting vertices by following edges is a graph traversal, which is an algorithm.", "next_step": "Find the option that stores information."}}, "hints": ["A data structure organises and stores data.", "An algorithm is a list of steps; it doesn't store anything.", "Which option holds data that a program can look up?", "Answer: the dictionary of neighbour lists."]}, {"id": "m6-a-1-2", "objective_id": 1, "purpose": "mastery", "kind": "multiple_choice", "prompt": "Which of these is an **algorithm**?", "config": {"options": [{"id": "a", "text": "A list of steps for finding the largest mark in a class list"}, {"id": "b", "text": "A queue of students waiting at the library desk"}, {"id": "c", "text": "A map f the previous row's queue."}, "queue_order_wrong": {"result": "A queue is in the wrong order or has the wrong vertices.", "reason": "The current vertex leaves from the front, and its unvisited neighbours join at the back in alphabetical order.", "next_step": "Start from the previous queue, remove the front, then add new neighbours at the end."}, "visited_wrong": {"result": "A visited set is wrong.", "reason": "A vertex is visited as soon as it joins the queue, and it stays visited.", "next_step": "Add each newly queued vertex to the visited set from the row before."}}, "hints": ["Each row starts by taking the vertex at the front of the previous queue.", "Add the current vertex's unvisited neighbours to the back of the queue, in alphabetical order, and mark them visited.", "The first row: A leaves; the queue becomes B, D.", "Answer: order A, B, D, C, E, G, F. Queues after each row: [B, D]; [D, C, E]; [C, E]; [E, G]; [G, F]; [F]; []."]}, {"id": "m6-a-6-1", "objective_id": 6, "purpose": "mastery", "kind": "write_code", "prompt": "Write `bfs(graph, start)` so it returns the vertices in the order BFS visits them, taking neighbours in alphabetical order. Your `Graph` class is already loaded.", "config": {"language": "python", "provided_code": "class Graph:\n    def __init__(self, directed=False):\n        self.directed = directed\n        self.adjacency = {}  # vertex -> list of neighbours\n\n    def add_vertex(self, v):\n        if v not in self.adjacency:\n            self.adjacency[v] = []\n\n    def add_edge(self, a, b):\n        self.add_vertex(a)\n        self.add_vertex(b)\n        self.adjacency[a].append(b)\n        if not self.directed:\n            self.adjacency[b].append(a)\n", "starter_code": "from collections import deque\n\n\ndef bfs(graph, start):\n    \"\"\"Return the vertices in the order BFS visits them from start.\n    Take neighbours in alphabetical order.\"\"\"\n    ...\n", "example_tests": [{"name": "example", "scenario_id": "m6-code-line", "code": "g = Graph(directed=False)\ng.add_vertex(\"V\")\ng.add_vertex(\"W\")\ng.add_vertex(\"X\")\ng.add_vertex(\"Y\")\ng.add_vertex(\"Z\")\ng.add_edge(\"Z\", \"Y\")\ng.add_edge(\"Y\", \"X\")\ng.add_edge(\"X\", \"W\")\ng.add_edge(\"W\", \"V\")\nassert bfs(g, \"X\") == [\"X\", \"W\", \"Y\", \"V\", \"Z\"]\n"}]}, "answer": {"reference_solution": "from collections import deque\n\n\ndef bfs(graph, start):\n    visited = {start}\n    queue = deque([start])\n    order = []\n    while queue:\n        v = queue.popleft()\n        order.append(v)\n        for n in sorted(graph.adjacency[v]):\n            if n not in visited:\n                visited.add(n)\n                queue.append(n)\n    return order\n", "hidden_tests": [{"name": "returns_a_list", "scenario_id": "m6-code-cycle", "code": "g = Graph(directed=False)\ng.add_vertex(\"A\")\ng.add_vertex(\"B\")\ng.add_vertex(\"C\")\ng.add_vertex(\"D\")\ng.add_edge(\"A\", \"B\")\ng.add_edge(\"B\", \"C\")\ng.add_edge(\"C\", \"D\")\ng.add_edge(\"D\", \"A\")\ng.add_edge(\"A\", \"C\")\nassert isinstance(bfs(g, \"A\"), list)\n"}, {"name": "cycle_no_repeats", "scenario_id": "m6-code-cycle", "code": "g = Graph(directed=False)\ng.add_vertex(\"A\")\ng.add_vertex(\"B\")\ng.add_vertex(\"C\")\ng.add_vertex(\"D\")\ng.add_edge(\"A\", \"B\")\ng.add_edge(\"B\", \"C\")\ng.add_edge(\"C\", \"D\")\ng.add_edge(\"D\", \"A\")\ng.add_edge(\"A\", \"C\")\norder = bfs(g, \"A\")\nassert len(order) == len(set(order))\n"}, {"name": "order", "scenario_id": "m6-trace-a", "code": "g = Graph(directed=False)\ng.add_vertex(\"A\")\ng.add_vertex(\"B\")\ng.add_vertex(\"C\")\ng.add_vertex(\"D\")\ng.add_vertex(\"E\")\ng.add_vertex(\"F\")\ng.add_vertex(\"G\")\ng.add_edge(\"A\", \"B\")\ng.add_edge(\"A\", \"D\")\ng.add_edge(\"B\", \"C\")\ng.add_edge(\"B\", \"E\")\ng.add_edge(\"D\", \"E\")\ng.add_edge(\"E\", \"F\")\ng.add_edge(\"C\", \"G\")\ng.add_edge(\"F\", \"G\")\nassert bfs(g, \"A\") == [\"A\", \"B\", \"D\", \"C\", \"E\", \"G\", \"F\"]\n"}, {"name": "alphabetical_neighbours ]}, "feedback": {"correct": {"result": "All tests pass. Bug fixed.", "reason": "The function now gives the BFS order on every test graph.", "next_step": "Carry on with the next item."}, "cycle_no_repeats": {"result": "A vertex is visited twice in a graph with a cycle.", "reason": "Is it marked as visited when it is added to the queue? If it isn't, another neighbour can add it again.", "next_step": "Mark each neighbour visited at the moment it joins the queue."}, "order": {"result": "The order is wrong.", "reason": "BFS takes vertices from the front of the queue and adds new ones to the back.", "next_step": "Check you use popleft() and append()."}, "alphabetical_neighbours": {"result": "Neighbours aren't taken in alphabetical order.", "reason": "The edges were added out of order, but BFS takes neighbours alphabetically.", "next_step": "Loop over sorted(graph.adjacency[v])."}, "disconnected": {"result": "The disconnected graph gives the wrong result.", "reason": "BFS only returns vertices it can reach from the start.", "next_step": "Only add vertices you find through the queue."}, "directed": {"result": "The directed graph gives the wrong result.", "reason": "Follow only the arrows leaving each vertex, using graph.adjacency.", "next_step": "Don't add reverse edges yourself."}}, "hints": ["Run it on a graph with a cycle through the start. What goes wrong?", "Look at what's in visited before the loop.", "The start vertex is in the queue but never marked visited, so a neighbour can add it again.", "Answer: change `visited = set()` to `visited = {start}`."]}, {"id": "m6-b-7-3", "objective_id": 7, "purpose": "mastery", "kind": "write_tests", "prompt": "Write two tests for `bfs(graph, start)`: `test_cycle`, on a graph that contains a cycle, and `test_disconnected`, on a graph where some vertices can't be reached from the start. Each test builds a graph with `Graph` and uses `assert`. Your tests must pass on a correct BFS and catch the faulty versions we have.", "config": {"language": "python", "provided_code": "class Graph:\n    def __init__(self, directed=False):\n        self.directed = directed\n        self.adjacency = {}  # vertex -> list of neighbours\n\n    def add_vertex(self, v):\n        if v not in self.adjacency:\n            self.adjacency[v] = []\n\n    def add_edge(self, a, b):\n        self.add_vertex(a)\n        self.add_vertex(b)\n        self.adjacency[a].append(b)\n        if not self.directed:\n            self.adjacency[b].append(a)\n", "required_tests": ["test_cycle", "test_disconnected"], "starter_code": "def test_cycle():\n    # Build a graph with a cycle, then check bfs's result.\n    ...\n\n\ndef test_disconnected():\n    # Build a graph with a vertex BFS can't reach, then check bfs's result.\n    ...\n"}, "answer": {"reference_implementation": "from collections import deque\n\n\ndef bfs(graph, start):\n    visited = {start}\n    queue = deque([start])\n    order = []\n    while queue:\n        v = queue.popleft()\n        order.append(v)\n        for n in sorted(graph.adjacency[v]):\n            if n not in visited:\n                visited.add(n)\n                queue.append(n)\n    return order\n", "faulty_implementations": [{"name": "Forgets to mark the start vertex", "code": "from collections import deque\n\n\ndef bfs(graph, start):\n    visited = set()\n    queue = deque([start])\n    order = []\n    while queue:\n        v = queue.popleft()\n        order.append(v)\n        for n in sorted(graph.adjacency[v]):\n            if n not in visited:\n                visited.add(n)\n                queue.append(n)\n    return order\n"}, {"name": "Lists every vertex in the graph", "code": "from collections import deque\n\n\ndef bfs(graph, start):\n    visited = {start}\n    queue = deque([start])\n    order = []\n    while queue:\n        v = queue.popleft()\n        order.append(v)\n        for n in sorted(graph.adjacency[v]):\n            if n not in visited:\n                visited.add(n)\n                queue.append(n)\n    return order + [v for v in sorted(graph.adjacency) if v not in order]\n"}], "example_solution": "def test_cycle():\n    g = Graph()\n    g.add_edge(\"A\", \"B\")\n    g.add_edge(\"B\", \"C\")\n    g.add_edge(\"C\", \"A\")\n    assert bfs(g, \"A\") == [\"A\", \"B\", \"C\"]\n\n\ndef test_disconnected():\n    g = Graph()\n    g.add_edge(\"A\", \"B\")\n    g.add_vertex(\"C\")\n    assert bfs(g, \"A\") == [\"A\", \"B\"]\n"}, "feedback": {"correct": {"result": "Both tests are valid and catch every faulty version.", "reason": "They pass on a correct BFS and each faulty version fails at least one of them.", "next_step": "Carry on to your report."}, "missing_test": {"result": "A required test is missing.", "reason": "Name the tests exactly test_cycle and test_disconnected.", "next_step": "Check the spelling of both function names."}, "fails_on_correct": {"result": "A test fails on a correct BFS.", "reason": "Your expected result is wrong, so the test would reject working code.", "next_step": "Trace BFS by hand on your graph and use that order in the assert."}, "misses_faulty": {"result": "A faulty version passes your tests.", "reason": "A test that never fails can't catch a bug. Check the exact order, not just the length.", "next_step": "Assert the whole list bfs returns, on a graph where the bug shows."}}, "hints": ["A test builds a small graph, calls bfs and asserts the exact list it should return.", "For a cycle, use three vertices joined in a triangle. For disconnected, add a vertex with no edges.", "Work out the expected order by hand, then write `assert bfs(g, \"A\") == [...]`.", "Answer:\n```python\ndef test_cycle():\n    g = Graph()\n    g.add_edge(\"A\", \"B\")\n    g.add_edge(\"B\", \"C\")\n    g.add_edge(\"C\", \"A\")\n    assert bfs(g, \"A\") == [\"A\", \"B\", \"C\"]\n\n\ndef test_disconnected():\n    g = Graph()\n    g.add_edge(\"A\", \"B\")\n    g.add_vertex(\"C\")\n    assert bfs(g, \"A\") == [\"A\", \"B\"]\n```"]}, {"id": "m6-review-1", "objective_id": 1, "purpose": "review", "kind": "multiple_choice", "prompt": "A to-do list app stores tasks in a queue and has a function that removes finished tasks one by one. Which is the data structure, and which is the algorithm?", "config": {"options": [{"id": "a", "text": "The queue is the data structure; removing finished tasks one by one is the algorithm."}, {"id": "b", "text": "The function is the data structure; the queue is the algorithm."}, {"id": "c", "text": "They're both algorithms."}]}, "answer": {"correct": "a"}, "feedback": {"correct": {"result": "Correct.", "reason": "The queue stores the tasks; removing finished tasks one by one is a list of steps.", "next_step": "Now try a fresh set of questions for this objective."}, "b": {"result": "Not quite. That's the wrong way round.", "reason": "The queue stores the tasks; the function is the steps.", "next_step": "Swap the roles."}, "c": {"result": "Not quite.", "reason": "The queue stores data, so it's a data structure.", "next_step": "Decide which one stores data."}}, "hints": ["One part stores the tasks; one part does something.", "Storing is a data structure's job.", "Doing something step by step is an algorithm.", "Answer: the queue is the data structure; the removing steps are the algorithm."]}, {"id": "m6-review-2", "objective_id": 2, "purpose": "review", "kind": "multiple_choice", "prompt": "A graph has the edges A \u2192 B and B \u2192 A, and nothing else. Is it directed or undirected?", "config": {"options": [{"id": "a", "text": "Directed: it has two separate one-way edges."}, {"id": "b", "text": "Undirected: you can go both ways between A and B."}, {"id": "c", "text": "Neither: a graph needs at least three vertices."}]}, "answer": {"correct": "a"}, "feedback": {"correct": {"result": "Correct.", "reason": "Each arrow is its own one-way edge, and any arrow makes a graph directed.", "next_step": "Now try a fresh set of questions for this objective."}, "b": {"result": "Not quite.", "reason": "Each arrow is its own one-way edge, so the graph is directed.", "next_step": "Look at whether the edges have arrows."}, "c": {"result": "Not quite.", "reason": "A graph can have any number of vertices.", "next_step": "Look at whether the edges have arrows."}}, "hints": ["Look at how the edges are written.", "\u2192 means an arrow.", "Any arrow makes the graph directed, even if there's one each way.", "Answer: directed, with two one-way edges."]}, {"id": "m6-review-3", "objective_id": 3, "purpose": "review", "kind": "multiple_choice", "prompt": "Students email each other. How should a graph of \u201cwho emailed whom\u201d be set up?", "config": {"options": [{"id": "a", "text": "Vertices: students. Edges: emails. Directed, because an email goes from one student to another."}, {"id": "b", "text": "Vertices: emails. Edges: students. Directed."}, {"id": "c", "text": "Vertices: students. Edges: emails. Undirected."}]}, "answer": {"correct": "a"}, "feedback": {"correct": {"result": "Correct.", "reason": "Students are the things, emails connect them, and an email goes one way.", "next_step": "Now try a fresh set of questions for this objective."}, "b": {"result": "Not quite. Vertices and edges are swapped.", "reason": "The things are the vertices; the connections between them are the edges.", "next_step": "Swap them round."}, "c": {"result": "Not quite.", "reason": "Sending an email doesn't mean you got one back, so each edge has a direction.", "next_step": "Check the direction."}}, "hints": ["What are the things? What connects them?", "Students are the things; emails connect them.", "Does an email go both ways?", "Answer: students as vertices, emails as directed edges."]}, {"id": "m6-review-4", "objective_id": 4, "purpose": "review", "kind": "multiple_choice", "prompt": "Which problem is BFS a good fit for?", "config": {"options": [{"id": "a", "text": "Finding the fewest bus changes between two stops"}, {"id": "b", "text": "Finding the shortest route in kilometres, where roads have different lengths"}, {"id": "c", "text": "Adding up the prices on a till slip"}]}, "answer": {"correct": "a"}, "feedback": {"correct": {"result": "Correct.", "reason": "Bus changes are edges between stops, and BFS finds the route with the fewest edges.", "next_step": "Now try a fresh set of questions for this objective."}, "b": {"result": "Not quite.", "reason": "BFS counts edges, not kilometres.", "next_step": "Look for a problem about the fewest edges."}, "c": {"result": "Not quite.", "reason": "There are no connections to follow.", "next_step": "Look for a problem about the fewest edges."}}, "hints": ["BFS counts edges.", "Which problem is about the fewest connections?", "Bus changes are edges between stops.", "Answer: the fewest bus changes."]}, {"id": "m6-review-5", "objective_id": 5, "purpose": "review", "kind": "multiple_choice", "prompt": "The queue is **C, D** and the visited set is A, B, C, D. BFS processes C, whose neighbours are A, D and E. What is the queue now?", "config": {"options": [{"id": "a", "text": "D, E"}, {"id": "b", "text": "D, A, E"}, {"id": "c", "text": "E, D"}]}, "answer": {"correct": "a"}, "feedback": {"correct": {"result": "Correct.", "reason": "C leaves from the front. A and D are already visited, so only E joins, at the back.", "next_step": "Now try a fresh set of questions for this objective."}, "b": {"result": "Not quite. A is already visited.", "reason": "Visited vertices never join the queue again.", "next_step": "Skip every neighbour in the visited set."}, "c": {"result": "Not quite. New vertices join at the back.", "reason": "D was already waiting, so it stays at the front.", "next_step": "Remove C from the front, then add E at the back."}}, "hints": ["C leaves from the front.", "Check each neighbour against the visited set.", "Only E is new, and it joins at the back.", "Answer: D, E."]}, {"id": "m6-review-6", "objective_id": 6, "purpose": "review", "kind": "multiple_choice", "prompt": "Which line belongs inside `if n not in visited:` in BFS?", "config": {"options": [{"id": "a", "text": "`visited.add(n)` and `queue.append(n)`"}, {"id": "b", "text": "`order.append(n)`"}, {"id": "c", "text": "`v = queue.popleft()`"}]}, "answer": {"correct": "a"}, "feedback": {"correct": {"result": "Correct.", "reason": "A newly found neighbour is marked visited and joins the back of the queue, so it's never added twice.", "next_step": "Now try a fresh set of questions for this objective."}, "b": {"result": "Not quite.", "reason": "A vertex joins the order when it leaves the queue, not when it's found.", "next_step": "What should happen to a newly found neighbour?"}, "c": {"result": "Not quite.", "reason": "Taking from the queue happens once per loop, before looking at neighbours.", "next_step": "What should happen to a newly found neighbour?"}}, "hints": ["This runs for a neighbour that hasn't been found yet.", "It needs to be remembered, and it needs to wait its turn.", "Mark it visited and add it to the back of the queue.", "Answer: visited.add(n) and queue.append(n)."]}, {"id": "m6-review-7", "objective_id": 7, "purpose": "review", "kind": "multiple_choice", "prompt": "Which test would catch a BFS that visits a vertex twice?", "config": {"options": [{"id": "a", "text": "On a triangle A\u2013B, B\u2013C, C\u2013A: `assert bfs(g, \"A\") == [\"A\", \"B\", \"C\"]`"}, {"id": "b", "text": "On a single vertex A: `assert bfs(g, \"A\") == [\"A\"]`"}, {"id": "c", "text": "On a triangle: `assert len(bfs(g, \"A\")) > 0`"}]}, "answer": {"correct": "a"}, "feedback": {"correct": {"result": "Correct.", "reason": "A triangle lets a vertex be found twice, and asserting the exact list catches the repeat.", "next_step": "Now try a fresh set of questions for this objective."}, "b": {"result": "Not quite.", "reason": "With no edges, nothing can be added twice, so the bug never shows.", "next_step": "Use a graph with a cycle."}, "c": {"result": "Not quite.", "reason": "That passes even if a vertex appears twice. Check the exact list.", "next_step": "Assert the whole list."}}, "hints": ["The bug only shows when a vertex can be found twice.", "That needs a cycle.", "Then check the exact result, not just its length.", "Answer: the triangle test with the exact list."]}]}</script>

  const n = s.vertices.length, R = n <= 3 ? 80 : 60 + 14 * n, cx = 60 + R, cy = 40 + R;
  return Object.fromEntries(s.vertices.map((v, i) => { const ang = -Math.PI / 2 + (2 * Math.PI * i) / n; return [v.id, [Math.round(cx + R * Math.cos(ang)), Math.round(cy + R * Math.sin(ang))]]; }));
}
