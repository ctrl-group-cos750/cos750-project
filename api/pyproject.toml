# Tool config for the API. Dependencies stay in requirements*.txt, which the Dockerfile and CI install.

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import order
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "C4",       # comprehensions
  "PT",       # pytest style
  "RUF",      # ruff-specific
  "FAST",     # FastAPI
  "S",        # bandit security checks
]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest checks things

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Coverage for the whole app is reported on every run (issue #67). The 90% gate on the code that
# decides a student's results is a separate scoped run — see scripts/check.sh and the CI workflow.
addopts = "-ra --strict-markers --strict-config --cov=app --cov-report=term-missing --no-cov-on-fail"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
