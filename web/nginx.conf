# Serves the built SPA and forwards /api to the api service on the compose network,
# so the browser only ever talks to one origin.

# Staging gate (http-level maps). Empty unless STAGING_PASSWORD is set. See staging-gate.sh.
include /etc/nginx/gate-http.conf;

server {
    listen 80;
    # Error pages say "404 Not Found", not which nginx version we run.
    server_tokens off;
    root /usr/share/nginx/html;

    # Staging gate: serves the login page at /__gate/ until the cookie is right. Empty when off.
    include /etc/nginx/gate-server.conf;

    # For the container healthcheck, which has no credentials.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change, so cache them for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Staff uploads (app/routers/staff.py): up to 95 MB, streamed straight to the API instead of
    # buffered here. Cloudflare in front caps request bodies at 100 MB anyway.
    location = /api/staff/media {
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Narrated videos and captions from the media volume (docker-compose.yml), FR-3. A missing
    # file is a 404, not the app's index.html. Captions must be text/vtt or Firefox won't show
    # them. nginx answers Range requests itself, so seeking doesn't download the whole video.
    # Uploads get new names, so a file never changes and can be cached for a long time.
    location /media/ {
        alias /srv/media/;
        types {
            video/mp4 mp4;
            text/vtt vtt;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Static pages work without .html (/ui-kit); client-side routes fall back to index.html.
    # The page itself must be checked on every visit: it names the hashed assets of the current
    # build, so a cached copy keeps a browser on the old release after a deploy. Without this
    # header Cloudflare adds its default browser cache of 4 hours. "no-cache" still lets the
    # browser reuse the copy when the server says it hasn't changed (Last-Modified / ETag).
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri.html /index.html;
    }
}
