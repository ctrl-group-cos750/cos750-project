# Weekly update PRs, into staging like every other change. Minor and patch bumps are grouped
# into one PR per ecosystem; majors come one at a time.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    target-branch: staging
    schedule: { interval: weekly }
    groups:
      web-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /api
    target-branch: staging
    schedule: { interval: weekly }
    groups:
      api-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/web, /api]
    target-branch: staging
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule: { interval: weekly }
