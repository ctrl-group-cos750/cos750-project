# Serves the built SPA and forwards /api to the api service on the compose network,
# so the browser only ever talks to one origin.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Basic auth when BASIC_AUTH_USER/PASSWORD are set (staging); empty otherwise. See basic-auth.sh.
    include /etc/nginx/auth.conf;

    # For the container healthcheck, which has no credentials.
    location = /healthz {
        auth_basic off;
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change, so cache them for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
