name: ci

on:
  pull_request:
    branches: [staging, master]
  push:
    branches: [staging, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ctrl
          POSTGRES_PASSWORD: ctrl
          POSTGRES_DB: ctrl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctrl -d ctrl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check --output-format=github .
      - run: mypy
      - run: pytest
      # Again on Postgres, as deployed: SQLite accepts things Postgres refuses (NUL in text).
      - name: pytest on Postgres
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ctrl:ctrl@localhost:5432/ctrl

  # Builds the images Coolify will build, so a broken Dockerfile fails here, not on deploy.
  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker compose build
