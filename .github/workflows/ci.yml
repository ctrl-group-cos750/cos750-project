name: ci

# On PRs only: a PR tests exactly what its merge puts on staging or master, so running again on
# the push that merge makes would only repeat it. (push-guard checks every push.)
on:
  pull_request:
    branches: [staging, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts the PR touches, so a docs-only PR doesn't build and test the apps. A skipped job
  # counts as passed for required checks. A change to this file runs everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      web: ${{ steps.paths.outputs.web }}
      api: ${{ steps.paths.outputs.api }}
      runner: ${{ steps.paths.outputs.runner }}
      compose: ${{ steps.paths.outputs.compose }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          echo "$files"
          touched() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          all=$(touched '^\.github/workflows/ci\.yml$')
          # The API's tests also scan web/src, runner and scripts for hidden characters.
          for area in web api runner compose; do
            case $area in
              web) pattern='^web/' ;;
              api) pattern='^(api|runner|scripts|web/src)/' ;;
              runner) pattern='^runner/' ;;
              compose) pattern='^(api|web|runner)/|^docker-compose[^/]*\.yml$|^\.env\.example$' ;;
            esac
            value=$(touched "$pattern")
            [ "$all" = true ] && value=true
            echo "$area=$value" >> "$GITHUB_OUTPUT"
            echo "$area: $value"
          done

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ctrl
          POSTGRES_PASSWORD: ctrl
          POSTGRES_DB: ctrl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctrl -d ctrl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check --output-format=github .
      - run: mypy
      - run: pytest
      # Again on Postgres, as deployed: SQLite accepts things Postgres refuses (NUL in text).
      - name: pytest on Postgres
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ctrl:ctrl@localhost:5432/ctrl

  runner:
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runner/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check --output-format=github .
      - run: mypy
      - run: pytest --cov  # fails under 90% coverage

  # Builds the images Coolify will build, so a broken Dockerfile fails here, not on deploy.
  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker compose build
      # Hostile code against the real runner image with docker-compose.yml's limits, from a second
      # container on the runner's internal network (NFR-S7).
      - name: Start the whole stack
        run: docker compose -p ctrlci up -d --wait
      # The runner has no network: the checks reach it, like the API, through its socket volume.
      - name: The runner container has no network at all
        run: docker compose -p ctrlci exec -T runner python - < runner/tests/network_check.py
      - name: Hostile code against the runner container
        run: >-
          docker run --rm -v ctrlci_runner-socket:/run/runner
          -v "$PWD/runner/tests/container_check.py:/check.py:ro"
          python:3.12-slim python /check.py unix:/run/runner/runner.sock
      # Whatever the sandbox does, only running code is affected: the app is measured at rest,
      # then while the sandbox is flooded with hostile code, then with the runner stopped.
      - name: The app keeps working while the sandbox is flooded
        run: |
          docker run --rm --network ctrlci_default -v ctrlci_runner-socket:/run/runner \
            -v "$PWD/runner/tests/isolation_check.py:/check.py:ro" \
            python:3.12-slim python /check.py flood http://web unix:/run/runner/runner.sock
      - name: The app works with the runner stopped
        run: |
          docker compose -p ctrlci stop runner
          docker run --rm --network ctrlci_default \
            -v "$PWD/runner/tests/isolation_check.py:/check.py:ro" \
            python:3.12-slim python /check.py runner-down http://web
      - name: Logs
        if: always()
        run: docker compose -p ctrlci logs --tail 50
      - run: docker compose -p ctrlci down -v
        if: always()
