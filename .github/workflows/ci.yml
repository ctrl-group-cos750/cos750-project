name: ci

# On PRs only: a PR tests exactly what its merge puts on staging or master, so running again on
# the push that merge makes would only repeat it. (push-guard checks every push.)
on:
  pull_request:
    branches: [staging, master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, not one per part: GitHub bills each job rounded up to a whole minute, so four short
  # jobs cost twice what one does. Each part's steps run only when the PR touches that part; a
  # change to this file runs them all.
  checks:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci
    steps:
      - uses: actions/checkout@v5

      - name: Which parts the PR touches
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          echo "$files"
          touched() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          all=$(touched '^\.github/workflows/ci\.yml$')
          # The API's tests also scan web/src and scripts for hidden characters.
          for area in web api compose; do
            case $area in
              web) pattern='^web/' ;;
              api) pattern='^(api|scripts|web/src)/' ;;
              compose) pattern='^(api|web|e2e)/|^docker-compose[^/]*\.yml$|^\.env\.example$' ;;
            esac
            value=$(touched "$pattern")
            [ "$all" = true ] && value=true
            echo "$area=$value" >> "$GITHUB_OUTPUT"
            echo "$area: $value"
          done
          # The end-to-end tests (about 36 minutes in three browsers) run only on the PR that takes
          # staging to master, to save Actions minutes; PRs into staging run them locally first
          # (e2e/README.md). The image build above still runs on every PR that touches the stack.
          compose=$(touched '^(api|web|e2e)/|^docker-compose[^/]*\.yml$|^\.env\.example$')
          [ "$all" = true ] && compose=true
          e2e=false
          [ "$compose" = true ] && [ "$BASE" = master ] && e2e=true
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "e2e: $e2e (base $BASE)"

      # web
      - if: steps.paths.outputs.web == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web
        if: steps.paths.outputs.web == 'true'
        working-directory: web
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run coverage
          npm run build
          npm run check:api

      # api
      - if: steps.paths.outputs.api == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Postgres for the API's tests
        if: steps.paths.outputs.api == 'true'
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=ctrl -e POSTGRES_PASSWORD=ctrl \
            -e POSTGRES_DB=ctrl postgres:18-alpine
          until docker exec pg pg_isready -U ctrl -d ctrl; do sleep 1; done
      - name: api
        if: steps.paths.outputs.api == 'true'
        working-directory: api
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/ruff format --check .
          .venv/bin/ruff check --output-format=github .
          .venv/bin/mypy
          .venv/bin/pytest
          # 90% gate on the code that decides a student's results (issue #67). Add each new
          # result module's --cov target and its test file here in the PR that adds it.
          .venv/bin/pytest -o addopts="" \
            --cov=app.services.bfs --cov=app.services.checking --cov=app.services.rewards \
            --cov=app.services.mastery \
            --cov-branch --cov-fail-under=90 --cov-report=term-missing \
            tests/test_bfs.py tests/test_checking.py tests/test_rewards.py tests/test_activity_kinds.py \
            tests/test_mastery.py
      # Again on Postgres, as deployed: SQLite accepts things Postgres refuses (NUL in text).
      - name: api on Postgres
        if: steps.paths.outputs.api == 'true'
        working-directory: api
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ctrl:ctrl@localhost:5432/ctrl
        run: .venv/bin/pytest

      # The images Coolify will build, so a broken Dockerfile fails here, not on deploy. With
      # docker-compose.e2e.yml the stack is also served over HTTPS for the end-to-end tests.
      - name: Build the whole stack
        if: steps.paths.outputs.compose == 'true'
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml build
      - name: Start the whole stack
        if: steps.paths.outputs.e2e == 'true'
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -p ctrlci up -d --wait

      # End-to-end and accessibility tests in three browsers (e2e/, SE document §14.1). Only on the
      # PR from staging to master (see "Which parts the PR touches").
      - if: steps.paths.outputs.e2e == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: End-to-end tests (Chromium, Firefox, WebKit)
        if: steps.paths.outputs.e2e == 'true'
        working-directory: e2e
        timeout-minutes: 70
        env:
          # The setup project makes a staff account with `docker compose exec` (tests/env.ts).
          COMPOSE_PROJECT_NAME: ctrlci
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          npx playwright test
      - name: Upload the Playwright report
        if: failure() && steps.paths.outputs.e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Logs
        if: always() && steps.paths.outputs.e2e == 'true'
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -p ctrlci logs --tail 50
      - if: always() && steps.paths.outputs.e2e == 'true'
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -p ctrlci down -v
