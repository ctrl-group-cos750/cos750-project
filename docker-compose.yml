# Coolify deploys this file as-is (Docker Compose build pack). Only `web` gets a domain;
# it serves the SPA and forwards /api to `api`. Nothing publishes a port: Coolify's proxy
# reaches `web` on the internal network. For local use add docker-compose.local.yml.
services:
  web:
    build: ./web
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./api
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ctrl}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-ctrl}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctrl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-ctrl}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
